<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מ-0 ל-AI | פורטל אסטרטגי</title>
<meta name="description" content="פורטל פרומפטים שמתחיל מהכאב: תארו את הבעיה, קבלו פרומפט מהונדס, וראו במה הוא עדיף על מה שהייתם כותבים לבד. 50 מנועים, עובד גם ללא רשת.">
<meta name="theme-color" content="#050810">
<meta name="color-scheme" content="dark light">

<meta property="og:type" content="website">
<meta property="og:title" content="מ-0 ל-AI | פורטל אסטרטגי">
<meta property="og:description" content="מכאב לפרומפט שעובד. 50 מנועי פרומפטים, בונה מנועים אישי, והכל נשמר אצלכם במכשיר.">
<meta property="og:locale" content="he_IL">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon.svg">

<!-- The web font is a progressive enhancement: the stack in styles.css falls
     back to the system Hebrew face, so the portal stays readable offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800;900&display=swap"></noscript>

<link rel="stylesheet" href="./styles.css">

<script>
  // Applied before first paint so a light-theme user never sees a dark flash.
  try {
    var stored = JSON.parse(localStorage.getItem('sp.v2.settings') || '{}');
    var theme = stored.theme || 'dark';
    if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    if (stored.locale === 'en') {
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
    }
  } catch (error) { /* private mode: keep the defaults in the markup */ }
</script>
</head>
<body>

<div id="app-loader">
  <div class="spinner"></div>
  <p style="color:var(--text-muted);font-weight:700;letter-spacing:.08em;font-size:.8rem">טוען מערכת...</p>
</div>

<noscript>
  <div style="max-width:640px;margin:64px auto;padding:24px;text-align:center">
    <h1>מ-0 ל-AI</h1>
    <p>הפורטל בנוי כאפליקציה מקומית שרצה בדפדפן, ולכן הוא דורש JavaScript. הפעילו אותו והרעננו את הדף.</p>
  </div>
</noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
