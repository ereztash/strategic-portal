<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מ-0 ל-AI | פורטל אסטרטגי</title>
<meta name="description" content="פורטל פרומפטים שמתחיל מהכאב: תארו את הבעיה, קבלו פרומפט מהונדס, וראו במה הוא עדיף על מה שהייתם כותבים לבד. 50 מנועים, עובד גם ללא רשת.">
<meta name="theme-color" content="#050810">
<meta name="color-scheme" content="dark light">

<!-- The portal is passed around in WhatsApp, which renders a bare link
     without a raster og:image and needs the URL absolute to fetch it. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="מ-0 ל-AI">
<meta property="og:title" content="מ-0 ל-AI | פורטל אסטרטגי">
<meta property="og:description" content="מכאב לפרומפט שעובד. 50 מנועי פרומפטים, בונה מנועים אישי, והכל נשמר אצלכם במכשיר.">
<meta property="og:locale" content="he_IL">
<meta property="og:url" content="https://strategic-portal.vercel.app/">
<meta property="og:image" content="https://strategic-portal.vercel.app/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="מכאב לפרומפט שעובד - 50 מנועי פרומפטים בעברית">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://strategic-portal.vercel.app/">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<!-- iOS ignores the manifest's icons and will not take an SVG here, so an
     installed portal showed a blank tile until this was a PNG. -->
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">

<!-- The font is served from this origin - see the @font-face block in
     styles.css for why. Only the Hebrew subset is preloaded: it is what the
     interface is actually set in, and the Latin subsets load on demand. -->
<link rel="preload" href="./assets/fonts/assistant-hebrew.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="./styles.css">

<script>
  // Applied before first paint so a light-theme user never sees a dark flash.
  try {
    var stored = JSON.parse(localStorage.getItem('sp.v2.settings') || '{}');
    var theme = stored.theme || 'dark';
    if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    if (stored.locale === 'en') {
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
    }
  } catch (error) { /* private mode: keep the defaults in the markup */ }
</script>
</head>
<body>

<div id="app-loader">
  <div class="spinner"></div>
  <p style="color:var(--text-muted);font-weight:700;letter-spacing:.08em;font-size:.8rem">טוען מערכת...</p>
</div>

<noscript>
  <div style="max-width:640px;margin:64px auto;padding:24px;text-align:center">
    <h1>מ-0 ל-AI</h1>
    <p>הפורטל בנוי כאפליקציה מקומית שרצה בדפדפן, ולכן הוא דורש JavaScript. הפעילו אותו והרעננו את הדף.</p>
  </div>
</noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
